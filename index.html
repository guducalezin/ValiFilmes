<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Descubra filmes, compartilhe suas avaliações e organize seus favoritos no ValiFilmes."
    />
    <title>ValiFilmes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar navbar-expand-lg" aria-label="Navegação principal">
        <div class="container-fluid site-nav">
          <a class="brand" href="#home" aria-label="ValiFilmes — início">
            <img src="assets/logo.png" alt="" class="logo" />
            <span>VALI<span class="brand-accent">FILMES</span></span>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavigation"
            aria-controls="mainNavigation"
            aria-expanded="false"
            aria-label="Abrir menu"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNavigation">
            <form class="search-bar" id="navSearchForm" role="search">
              <label class="visually-hidden" for="navSearchInput">Pesquisar filmes</label>
              <input
                id="navSearchInput"
                name="query"
                class="form-control"
                type="search"
                placeholder="Busque por um filme..."
                autocomplete="off"
              />
              <button class="search-submit" type="submit" aria-label="Pesquisar">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="10.8" cy="10.8" r="6.8"></circle>
                  <path d="m16 16 5 5"></path>
                </svg>
                <span>Pesquisar</span>
              </button>
            </form>
            <div class="nav-links">
              <a class="nav-link" href="#favorites" data-route-link="favorites">
                <span class="nav-icon" aria-hidden="true">♥</span> Favoritos
              </a>
              <a class="nav-link" href="#activity" data-route-link="activity">
                <span class="nav-icon" aria-hidden="true">◷</span> Atividade
              </a>
              <a class="nav-link" href="#profile" data-route-link="profile">
                <span class="nav-icon" aria-hidden="true">◎</span> Perfil
              </a>
              <a class="nav-link" href="#settings" data-route-link="settings">
                <span class="nav-icon" aria-hidden="true">⚙</span> Configurações
              </a>
              <button class="nav-link logout-link" type="button" data-action="logout">Sair</button>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main id="app" class="page-shell" tabindex="-1"></main>
    <div id="toastRegion" class="toast-region" aria-live="polite"></div>
    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
